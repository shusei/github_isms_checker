name: ISMS Regulation Date Checker

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at 08:00 AM Taiwan time (00:00 UTC)
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  check-dates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Date Check Script
        run: python check.py

      - name: Commit and Push Updated dates.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dates.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update ISMS regulation dates" && git push)
